security:
    
    password_hashers:
        App\Entity\User:
            algorithm: auto

    
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                default_target_path: app_gestionnaire_dashboard

            logout:
                path: app_logout
                target: app_login

    # Contrôle d’accès
    access_control:
        # Page de connexion accessible à tous
        - { path: ^/login, roles: PUBLIC_ACCESS }

        
        - { path: ^/gestionnaire, roles: ROLE_GESTIONNAIRE }

